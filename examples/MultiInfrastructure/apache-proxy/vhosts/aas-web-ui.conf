<VirtualHost *:80>
    ServerName aasgui.basyx.localhost
    
    ProxyPreserveHost On
    ProxyPass / http://aas-web-ui:3000/
    ProxyPassReverse / http://aas-web-ui:3000/
    
    # WebSocket support
    RewriteEngine on
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://aas-web-ui:3000/$1" [P,L]
    
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 common
</VirtualHost>
