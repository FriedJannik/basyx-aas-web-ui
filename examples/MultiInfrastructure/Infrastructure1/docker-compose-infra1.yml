services:
  # Identity provider (Keycloak) for infrastructure 1
  keycloak-trameri:
    build:
      context: ..
      dockerfile: shared-dockerfiles/Dockerfile.keycloak
    image: keycloak-trameri:ssl
    container_name: keycloak-trameri
    extra_hosts:
      - "keycloak-broker.basyx.localhost:host-gateway"
      - "keycloak.trameri.basyx.localhost:host-gateway"
      - "keycloak.eurogoodies.basyx.localhost:host-gateway"
    environment:
      VIRTUAL_HOST: keycloak.trameri.basyx.localhost
      VIRTUAL_PORT: "8080"
      VIRTUAL_PROTO: http
      KC_HOSTNAME: keycloak.trameri.basyx.localhost
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY: edge
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: keycloak-admin
      KC_HEALTH_ENABLED: "true"
      KC_IMPORT: /opt/keycloak/data/import/
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    ports:
      - 9097:8080
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import
    networks:
      - multiple-infrastructures
      
  # Healthcheck for Keycloak service
  keycloak-trameri-healthcheck:
    image: curlimages/curl:latest
    container_name: keycloak-trameri-healthcheck
    command: >
      sh -c "
        echo 'Waiting for Keycloak Trameri to become ready...';
        until curl -sf http://keycloak-trameri:8080/health/ready; do
          sleep 5;
        done;
        echo 'Keycloak Trameri is ready!'"
    depends_on:
      - keycloak-trameri
    networks:
      - multiple-infrastructures

  # Infrastructure 1 AAS Discovery service
  aas-discovery-trameri:
    build:
      context: ..
      dockerfile: shared-dockerfiles/Dockerfile.aas-discovery
    image: basyx-aas-discovery-trameri:ssl
    container_name: secured-aas-discovery
    extra_hosts:
      - "keycloak.trameri.basyx.localhost:host-gateway"
      - "keycloak-broker.basyx.localhost:host-gateway"
    environment:
      VIRTUAL_HOST: discovery.trameri.basyx.localhost
      VIRTUAL_PORT: "8081"
      # Component configuration
      SERVER_PORT: 8081
      BASYX_BACKEND: MongoDB
      SPRING_DATA_MONGODB_HOST: mongo
      SPRING_DATA_MONGODB_DATABASE: aas-discovery-1
      SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE: admin
      SPRING_DATA_MONGODB_USERNAME: mongoAdmin
      SPRING_DATA_MONGODB_PASSWORD: mongoPassword
      BASYX_CORS_ALLOWED_ORIGINS: '*'
      BASYX_CORS_ALLOWED_METHODS: 'GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD'
      # Security configuration
      BASYX_FEATURE_AUTHORIZATION_ENABLED: true
      BASYX_FEATURE_AUTHORIZATION_TYPE: rbac
      BASYX_FEATURE_AUTHORIZATION_JWTBEARERTOKENPROVIDER: keycloak
      BASYX_FEATURE_AUTHORIZATION_RBAC_FILE: file:/application/rbac_rules.json
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://keycloak.trameri.basyx.localhost/realms/Trameri
    volumes:
      - ./rules/aas-discovery-rules.json:/application/rbac_rules.json
    ports:
      - '8084:8081'
    restart: unless-stopped
    depends_on:
      keycloak-trameri-healthcheck:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    networks:
      - multiple-infrastructures

  # Infrastructure 1 AAS Registry service
  aas-registry-trameri:
    build:
      context: ..
      dockerfile: shared-dockerfiles/Dockerfile.aas-registry
    image: basyx-aas-registry-trameri:ssl
    container_name: secured-aas-registry
    extra_hosts:
      - "keycloak.trameri.basyx.localhost:host-gateway"
      - "keycloak-broker.basyx.localhost:host-gateway"
    ports:
      - "8082:8080"
    environment:
      VIRTUAL_HOST: aasreg.trameri.basyx.localhost
      VIRTUAL_PORT: "8080"
      # Component configuration
      SERVER_PORT: 8080
      SPRING_DATA_MONGODB_URI: mongodb://mongoAdmin:mongoPassword@mongo:27017
      SPRING_DATA_MONGODB_DATABASE: aas-registry-1
      SERVER_SERVLET_CONTEXT_PATH: /
      BASYX_CORS_ALLOWED_ORIGINS: '*'
      BASYX_CORS_ALLOWED_METHODS: GET,POST,PATCH,DELETE,PUT,OPTIONS,HEAD
      # Security configuration
      BASYX_FEATURE_AUTHORIZATION_ENABLED: true
      BASYX_FEATURE_AUTHORIZATION_TYPE: rbac
      BASYX_FEATURE_AUTHORIZATION_JWTBEARERTOKENPROVIDER: keycloak
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://keycloak.trameri.basyx.localhost/realms/Trameri
      BASYX_FEATURE_AUTHORIZATION_RBAC_FILE: file:/workspace/config/rbac_rules.json
    volumes:
      - ./rules/aas-registry-rules.json:/workspace/config/rbac_rules.json
    restart: unless-stopped
    depends_on:
      keycloak-trameri-healthcheck:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    networks:
      - multiple-infrastructures

  # Infrastructure 1 Submodel Registry service
  sm-registry-trameri:
    build:
      context: ..
      dockerfile: shared-dockerfiles/Dockerfile.sm-registry
    image: basyx-sm-registry-trameri:ssl
    container_name: secured-sm-registry
    extra_hosts:
      - "keycloak.trameri.basyx.localhost:host-gateway"
      - "keycloak-broker.basyx.localhost:host-gateway"
    environment:
      VIRTUAL_HOST: smreg.trameri.basyx.localhost
      VIRTUAL_PORT: "8080"
      # Component configuration
      SERVER_PORT: 8080
      SPRING_DATA_MONGODB_URI: mongodb://mongoAdmin:mongoPassword@mongo:27017
      SPRING_DATA_MONGODB_DATABASE: sm-registry-1
      SERVER_SERVLET_CONTEXT_PATH: /
      BASYX_CORS_ALLOWED_ORIGINS: '*'
      BASYX_CORS_ALLOWED_METHODS: GET,POST,PATCH,DELETE,PUT,OPTIONS,HEAD
      # Security configuration
      BASYX_FEATURE_AUTHORIZATION_ENABLED: true
      BASYX_FEATURE_AUTHORIZATION_TYPE: rbac
      BASYX_FEATURE_AUTHORIZATION_JWTBEARERTOKENPROVIDER: keycloak
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://keycloak.trameri.basyx.localhost/realms/Trameri
      BASYX_FEATURE_AUTHORIZATION_RBAC_FILE: file:/workspace/config/rbac_rules.json
    ports:
      - "8083:8080"
    volumes:
      - ./rules/sm-registry-rules.json:/workspace/config/rbac_rules.json
    restart: unless-stopped
    depends_on:
      keycloak-trameri-healthcheck:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    networks:
      - multiple-infrastructures

  # Infrastructure 1 AAS Environment service
  aas-env-trameri:
    build:
      context: ..
      dockerfile: shared-dockerfiles/Dockerfile.aas-env
    image: basyx-aas-env-trameri:ssl
    container_name: secured-aas-env
    extra_hosts:
      - "keycloak.trameri.basyx.localhost:host-gateway"
      - "keycloak-broker.basyx.localhost:host-gateway"
    volumes:
      - ./aas:/application/aas
      - ./rules/aas-env-rules.json:/application/rbac_rules.json
    ports:
      - '8081:8081'
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: aasenv.trameri.basyx.localhost
      VIRTUAL_PORT: "8081"
      # Component configuration
      SERVER_PORT: 8081
      BASYX_BACKEND: MongoDB
      SPRING_DATA_MONGODB_HOST: mongo
      SPRING_DATA_MONGODB_DATABASE: aas-env-1
      SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE: admin
      SPRING_DATA_MONGODB_USERNAME: mongoAdmin
      SPRING_DATA_MONGODB_PASSWORD: mongoPassword
      BASYX_CORS_ALLOWED_ORIGINS: '*'
      BASYX_CORS_ALLOWED_METHODS: 'GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD'
      BASYX_ENVIRONMENT: file:aas
      BASYX_AASREPOSITORY_FEATURE_DISCOVERYINTEGRATION: http://aas-discovery-trameri:8081
      BASYX_AASREPOSITORY_FEATURE_REGISTRYINTEGRATION: http://aas-registry-trameri:8080
      BASYX_SUBMODELREPOSITORY_FEATURE_REGISTRYINTEGRATION: http://sm-registry-trameri:8080
      BASYX_EXTERNALURL: https://aasenv.trameri.basyx.localhost
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 1024MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 1024MB
      # Security configuration
      BASYX_FEATURE_AUTHORIZATION_ENABLED: true
      BASYX_FEATURE_AUTHORIZATION_TYPE: rbac
      BASYX_FEATURE_AUTHORIZATION_JWTBEARERTOKENPROVIDER: keycloak
      BASYX_FEATURE_AUTHORIZATION_RBAC_FILE: file:/application/rbac_rules.json
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://keycloak.trameri.basyx.localhost/realms/Trameri
      BASYX_AASENVIRONMENT_AUTHORIZATION_PRECONFIGURATION_TOKEN_ENDPOINT: https://keycloak.trameri.basyx.localhost/realms/Trameri/protocol/openid-connect/token
      BASYX_AASENVIRONMENT_AUTHORIZATION_PRECONFIGURATION_GRANT_TYPE: CLIENT_CREDENTIALS
      BASYX_AASENVIRONMENT_AUTHORIZATION_PRECONFIGURATION_CLIENT_ID: workstation-1
      BASYX_AASENVIRONMENT_AUTHORIZATION_PRECONFIGURATION_CLIENT_SECRET: nY0mjyECF60DGzNmQUjL81XurSl8etom
      BASYX_AASREPOSITORY_FEATURE_DISCOVERYINTEGRATION_AUTHORIZATION_ENABLED: true
      BASYX_AASREPOSITORY_FEATURE_DISCOVERYINTEGRATION_AUTHORIZATION_TOKEN_ENDPOINT: https://keycloak.trameri.basyx.localhost/realms/Trameri/protocol/openid-connect/token
      BASYX_AASREPOSITORY_FEATURE_DISCOVERYINTEGRATION_AUTHORIZATION_GRANT_TYPE: CLIENT_CREDENTIALS
      BASYX_AASREPOSITORY_FEATURE_DISCOVERYINTEGRATION_AUTHORIZATION_CLIENT_ID: workstation-1
      BASYX_AASREPOSITORY_FEATURE_DISCOVERYINTEGRATION_AUTHORIZATION_CLIENT_SECRET: nY0mjyECF60DGzNmQUjL81XurSl8etom
      BASYX_AASREPOSITORY_FEATURE_REGISTRYINTEGRATION_AUTHORIZATION_ENABLED: true
      BASYX_AASREPOSITORY_FEATURE_REGISTRYINTEGRATION_AUTHORIZATION_TOKEN_ENDPOINT: https://keycloak.trameri.basyx.localhost/realms/Trameri/protocol/openid-connect/token
      BASYX_AASREPOSITORY_FEATURE_REGISTRYINTEGRATION_AUTHORIZATION_GRANT_TYPE: CLIENT_CREDENTIALS
      BASYX_AASREPOSITORY_FEATURE_REGISTRYINTEGRATION_AUTHORIZATION_CLIENT_ID: workstation-1
      BASYX_AASREPOSITORY_FEATURE_REGISTRYINTEGRATION_AUTHORIZATION_CLIENT_SECRET: nY0mjyECF60DGzNmQUjL81XurSl8etom
      BASYX_SUBMODELREPOSITORY_FEATURE_REGISTRYINTEGRATION_AUTHORIZATION_ENABLED: true
      BASYX_SUBMODELREPOSITORY_FEATURE_REGISTRYINTEGRATION_AUTHORIZATION_TOKEN_ENDPOINT: https://keycloak.trameri.basyx.localhost/realms/Trameri/protocol/openid-connect/token
      BASYX_SUBMODELREPOSITORY_FEATURE_REGISTRYINTEGRATION_AUTHORIZATION_GRANT_TYPE: CLIENT_CREDENTIALS
      BASYX_SUBMODELREPOSITORY_FEATURE_REGISTRYINTEGRATION_AUTHORIZATION_CLIENT_ID: workstation-1
      BASYX_SUBMODELREPOSITORY_FEATURE_REGISTRYINTEGRATION_AUTHORIZATION_CLIENT_SECRET: nY0mjyECF60DGzNmQUjL81XurSl8etom
    depends_on:
      keycloak-trameri-healthcheck:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      aas-discovery-trameri:
        condition: service_healthy
      aas-registry-trameri:
        condition: service_healthy
      sm-registry-trameri:
        condition: service_healthy
    networks:
      - multiple-infrastructures
